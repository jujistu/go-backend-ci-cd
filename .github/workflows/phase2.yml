name: Phase 2 - SAST, Container Security & SBOM

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  packages: write

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  IMAGE_NAME: gochatapp
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================
  # GO SECURITY ANALYSIS
  # ============================================================
  go-security:
    name: Go Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      # ----------------------------------------------------
      # GOSEC - GO STATIC APPLICATION SECURITY TESTING
      # ----------------------------------------------------
      - name: Install Gosec
        run: |
          GOTOOLCHAIN=local go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10

      - name: Run Gosec
        run: |
          "$(go env GOPATH)/bin/gosec" \
            -fmt sarif \
            -out gosec-results.sarif \
            -exclude-generated \
            -severity medium \
            -confidence medium \
            ./...

      - name: Upload Gosec SARIF
        if: always() && hashFiles('gosec-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Upload Gosec report
        if: always() && hashFiles('gosec-results.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: gosec-results-${{ github.sha }}
          path: gosec-results.sarif
          retention-days: 30

      # ----------------------------------------------------
      # GOVULNCHECK - GO VULNERABILITY ANALYSIS
      # ----------------------------------------------------
      - name: Run Govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f
        with:
          go-version-file: go.mod
          go-package: ./...

  # ============================================================
  # CODEQL
  # ============================================================
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@c54b30b7df092240050e69945842bc67aee0f0f4

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@c54b30b7df092240050e69945842bc67aee0f0f4
        with:
          category: /language:go

  # ============================================================
  # BUILD + CONTAINER SECURITY + SBOM
  #
  # The Docker image is built exactly ONCE.
  #
  # The same local image is used for:
  #   1. Trivy vulnerability scan
  #   2. SBOM generation
  #   3. Trivy JSON report
  #
  # The image is NOT pushed in Phase 2.
  # ============================================================
  container-security:
    name: Build, Scan & SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false

      # ----------------------------------------------------
      # BUILD IMAGE ONCE
      # ----------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:ci
          provenance: false

      - name: Install Trivy
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.74.0"
          TRIVY_SHA256="2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz

          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -

          tar -xzf /tmp/trivy.tar.gz -C /tmp

          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

          trivy --version

      - name: Verify container security configuration
        run: |
          USER="$(docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --format '{{.Config.User}}')"
          CMD="$(docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --format '{{json .Config.Cmd}}')"
          PORTS="$(docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --format '{{json .Config.ExposedPorts}}')"

          echo "User: $USER"
          echo "Cmd: $CMD"
          echo "Ports: $PORTS"

          test "$USER" = "appuser"
          test "$CMD" = '["./gochatapp"]'
          echo "$PORTS" | grep -q '9010/tcp'

      # ----------------------------------------------------
      # TRIVY CONTAINER SECURITY GATE
      # ----------------------------------------------------
      - name: Scan container image with Trivy
        run: |
          trivy image \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # ----------------------------------------------------
      # GENERATE CYCLONEDX SBOM
      # ----------------------------------------------------
      - name: Generate CycloneDX SBOM
        run: |
          trivy image \
            --scanners vuln \
            --format cyclonedx \
            --output sbom.cdx.json \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # ----------------------------------------------------
      # GENERATE TRIVY JSON REPORT
      #
      # This report does NOT determine pass/fail.
      # The previous Trivy step is the security gate.
      # ----------------------------------------------------
      - name: Generate Trivy JSON report
        run: |
          trivy image \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-image-results.json \
            "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

      # ----------------------------------------------------
      # UPLOAD SECURITY ARTIFACTS
      # ----------------------------------------------------
      - name: Upload SBOM and Trivy report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-security-${{ github.sha }}
          path: |
            sbom.cdx.json
            trivy-image-results.json
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------
      - name: Login to GitHub Container Registry
        if: success()
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # PUSH VALIDATED IMAGE
      # ----------------------------------------------------
      - name: Push image to GHCR
        if: success()
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Pushing ${IMAGE}"

          docker tag \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${IMAGE}"

          docker push "${IMAGE}"
